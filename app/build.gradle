plugins { id "com.android.application" }

android {
    namespace "dev.alex.minlauncher"
    compileSdk 34

    defaultConfig {
        applicationId "dev.alex.minlauncher"
        minSdk 21
        targetSdk 30        // SHIELD runs Android 11 (API 30)
        versionCode 1
        versionName "1.0"
    }

    // Pinned to a keystore committed with the project. The container's own
    // ~/.android/debug.keystore is regenerated whenever the image is rebuilt,
    // which changes the signing identity and makes `adb install -r` fail with
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE. Pinning it keeps updates in place.
    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    // Deliberately zero dependencies — no AndroidX, no Material. Keeps the
    // APK tiny and the build hermetic (nothing to resolve but AGP itself).
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // self-signed; sideloaded via adb
        }
    }
    lint {
        // Sideloaded to a single SHIELD over adb, never published to Play, so
        // Play's "must target API 31+" floor does not apply. targetSdk stays at
        // 30 to match the device and avoid API-31 behaviour changes.
        disable "ExpiredTargetSdkVersion"
    }
    // The WebPs are compressed already; zipping them again only slows decoding.
    androidResources {
        noCompress += "webp"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Background images from scripts/generate_backgrounds.py ship in the APK as
// assets/backgrounds/ (WebPs + manifest.json). output/backgrounds/ is
// committed; without it the build still works but the launcher stays black.
def bgSource = rootProject.file("output/backgrounds")
def bgAssets = layout.buildDirectory.dir("generated/background-assets").get().asFile
def syncBackgrounds = tasks.register("syncBackgrounds", Sync) {
    from(bgSource) { include "manifest.json", "**/*.webp" }
    into(new File(bgAssets, "backgrounds"))
    doLast {
        if (!new File(bgSource, "manifest.json").exists()) {
            logger.warn("No ${bgSource}/manifest.json: building without backgrounds")
        }
    }
}
android.sourceSets.main.assets.srcDir(bgAssets)
tasks.named("preBuild") { dependsOn syncBackgrounds }

// Unit tests only (Backgrounds' pure logic, run on the JVM); nothing ships in the APK.
dependencies {
    testImplementation "junit:junit:4.13.2"
}
